<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SEO Content Studio</title>
    <script>
      // Single-Page Application redirect for GitHub Pages
      // Keeps query parameters and handles deep links back to root
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^/]+)/);
      var basePath = repoMatch ? '/' + repoMatch[1] + '/' : './';
      window.location.replace(basePath);
    </script>
    <meta http-equiv="refresh" content="0;url=./">
  </head>
  <body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h2 style="color:#f8fafc;margin-bottom:8px;">Redirecting to AI SEO Studio...</h2>
      <p style="font-size:14px;">If you are not redirected automatically, <a href="./" style="color:#10b981;">click here</a>.</p>
    </div>
  </body>
</html>
