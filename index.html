<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI SEO Content Studio</title>
    <meta name="description" content="Production-ready AI-powered SEO content platform with Gemini API research, human-first article generation, WordPress publishing, and multi-channel syndication to Facebook, Pinterest, and Instagram." />
    <meta property="og:title" content="AI SEO Content Studio" />
    <meta property="og:description" content="Production-ready AI-powered SEO content platform with Gemini API research, human-first article generation, WordPress publishing, and multi-channel syndication to Facebook, Pinterest, and Instagram." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Comprehensive safeguard against sandbox/iframe environments where window.fetch has only a getter
      (function() {
        try {
          var nativeFetch = window.fetch;
          var boundNativeFetch = typeof nativeFetch === 'function' ? nativeFetch.bind(window) : nativeFetch;
          var activeFetch = boundNativeFetch;

          function createAccessor() {
            return {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = typeof fn === 'function' ? fn : fn;
              },
              configurable: true,
              enumerable: true
            };
          }

          // 1. Try defining accessor on window
          try {
            Object.defineProperty(window, 'fetch', createAccessor());
          } catch (e) {}

          // 2. Walk entire prototype chain of window and redefine if getter-only or configurable
          var curr = window;
          while (curr && curr !== Object.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(curr, 'fetch');
              if (desc && (desc.configurable || typeof desc.set === 'undefined')) {
                Object.defineProperty(curr, 'fetch', createAccessor());
              }
            } catch (e) {}
            try {
              curr = Object.getPrototypeOf(curr);
            } catch (e) {
              break;
            }
          }

          // 3. Define on Window.prototype if accessible
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', createAccessor());
            } catch (e) {}
          }

          // 4. Define on globalThis if distinct
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', createAccessor());
            } catch (e) {}
          }
        } catch (e) {
          // Fail-safe
        }
      })();

      // Ensure trailing slash only for GitHub Pages project repositories
      (function() {
        if (typeof window !== 'undefined' && window.location && window.location.hostname.endsWith('github.io')) {
          var loc = window.location;
          if (!loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
            loc.replace(loc.pathname + '/' + loc.search + loc.hash);
          }
        }
      })();

      // Display startup errors gracefully, suppressing benign sandbox getter errors
      (function() {
        var isGetterFetchError = function(msg) {
          return typeof msg === 'string' && msg.indexOf('fetch') !== -1 && (msg.indexOf('getter') !== -1 || msg.indexOf('only a getter') !== -1);
        };

        window.addEventListener('error', function(event) {
          if (isGetterFetchError(event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
          var msg = document.getElementById('engine-status-text');
          if (msg) {
            msg.innerHTML = '<span style="color:#f87171;font-weight:600;">Notice: ' + (event.message || 'Initialization delayed') + '</span><br/><button onclick="window.location.reload()" style="margin-top:10px;padding:6px 14px;background:#059669;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;">Refresh Studio</button>';
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; color: #f8fafc; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; max-width: 440px; padding: 32px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 16px;">
          <div style="width: 36px; height: 36px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
          <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #f8fafc;">AI SEO Content Studio</h2>
          <p id="engine-status-text" style="font-size: 13px; color: #94a3b8; margin: 0 0 12px 0;">Initializing studio engine...</p>
          <div id="gh-pages-notice" style="display: none; padding: 14px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; font-size: 12px; color: #fbbf24; text-align: left; line-height: 1.5;">
            <strong>GitHub Pages Action Required:</strong><br/>
            In your GitHub repo (<code>content-studio</code>), go to <strong>Settings &rarr; Pages</strong>.<br/>
            Under <em>Build and deployment &gt; Source</em>, select <strong>"GitHub Actions"</strong>.
          </div>
        </div>
      </div>
    </div>
    <script>
      if (window.location.hostname.endsWith('github.io')) {
        setTimeout(function() {
          var notice = document.getElementById('gh-pages-notice');
          if (notice) notice.style.display = 'block';
        }, 2000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
