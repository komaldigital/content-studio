    <script>
      // Safeguard against iframe/sandbox environments where window.fetch has only a getter
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (target && target.fetch) {
            var _origFetch = target.fetch.bind(target);
            Object.defineProperty(target, 'fetch', {
              get: function() {
                return _origFetch;
              },
              set: function(fn) {
                _origFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Gracefully continue
        }
      })();
    </script>
